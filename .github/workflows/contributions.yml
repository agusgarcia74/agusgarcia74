# Genera la animación del gráfico de contribuciones (en los colores del perfil)
# y la publica en la rama "output", que el README usa como imagen.
name: Contributions animation

on:
  schedule:
    - cron: '0 6 * * *' # todos los días
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions.svg?palette=github-light&color_snake=#e24a10&color_dots=#e6e1d4,#f6c7ad,#f3a079,#ec7646,#e24a10
            dist/contributions-dark.svg?palette=github-dark&color_snake=#ff5a1f&color_dots=#161b22,#3b2316,#6b331a,#a8441c,#ff5a1f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
